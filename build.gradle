plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

build.dependsOn shadowJar

group = 'ltd.rymc'
version = '2.3.0-SNAPSHOT-6'
description = '领地Form菜单支持'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

compileJava {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url 'https://repo.aikar.co/content/groups/aikar/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'org.bukkit:bukkit:1.13.2-R0.1-SNAPSHOT'
    compileOnly 'com.github.Zrips:CMILib:1.5.6.3'
    compileOnly 'org.geysermc.floodgate:api:2.2.0-SNAPSHOT'

    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    implementation 'space.arim.dazzleconf:dazzleconf-ext-snakeyaml:1.3.0-M2'

    compileOnly('com.github.Zrips:Residence:a7297eb5cb') {
        transitive = false
    }
}

shadowJar {
    archiveClassifier.set("")

    relocate 'co.aikar.', 'ltd.rymc.form.residence.shade.co.aikar.'
    relocate 'space.arim.', 'ltd.rymc.form.residence.shade.space.arim.'
}

jar {
    enabled = false
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('**/*.yml') {
        expand project.properties
    }
}


